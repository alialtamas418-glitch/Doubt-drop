# MySQL Profile Configuration: activate with --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3300/doubtdrop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.h2.console.enabled=false
