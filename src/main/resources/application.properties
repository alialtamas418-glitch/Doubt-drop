spring.application.name=DoubtDrop
server.port=${PORT:8080}

# Default DataSource: Embedded persistent H2 file DB (works out of the box with zero external dependencies)
# Data is safely persisted in the ./data/ directory across restarts
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/doubtdrop_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Enable H2 Web Console for interactive database inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Teacher / Admin Credentials
app.admin.username=${ADMIN_USERNAME:teacher}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
